server:
  port: 8085

spring:
  application:
    name: shortly

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
#      username: ${REDIS_USERNAME}
#      password: ${REDIS_PASSWORD}
#      ssl:
#        enabled: true
#      timeout: 5000ms
#      connect-timeout: 5000ms

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      ssl.truststore.type: PEM
      ssl.truststore.location: ${CERTIFICATE_PATH}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        metadata.max.age.ms: 300000
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        retry.backoff.ms: 100
        retry.backoff.max.ms: 1000
        batch.size: 32768
        linger.ms: 5
        compression.type: zstd
        max.block.ms: 60000
        spring.json.add.type.headers: true
        min.in.sync.replicas: 2

    consumer:
      group-id: analytics-group
      # Start from the earliest available offset when no committed offset exists
      auto-offset-reset: earliest
      # Disable automatic offset commits
      enable-auto-commit: false
      # Deserialization
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
#        spring.json.value.default.type: com.urlshortner.shortly.Url.events.ClickCaptureEvent
        spring.json.trusted.packages: com.urlshortner.shortly.Url.events
        spring.json.use.type.headers: true

        # Consumer performance
        max.poll.records: 100
        max.poll.interval.ms: 300000
        max.partition.fetch.bytes: 1048576
        fetch.max.bytes: 52428800
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500

        # Session and heartbeat
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000

        # Connection reliability
        request.timeout.ms: 30000
        default.api.timeout.ms: 60000

      listener:
        # Commit offsets after successfully processing a batch
        ack-mode: batch
        # Number of concurrent consumer threads
        concurrency: 3
        # Do not automatically acknowledge failed records
        ack-on-error: false
        # Retry handling is configured separately using DefaultErrorHandler
        missing-topics-fatal: true

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect #in newer version of spring 4 no need of specifying dailect property and no use mysqldailect not mysql8dailect
        format_sql: true
    show_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            #/login/oauth2/code/google
            scope:
              - email
              - profile
              - openid
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:shortly}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:600} #use 600 which is 10min
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}

app:
  cors:
    front-end-url: ${FRONT_END_URL:http://localhost:5173}
  auth:
    frontend:
      success-redirect: ${FRONT_END_SUCCESS_REDIRECT:http://localhost:5173/home}
      failure-redirect: ${FRONT_END_FAILURE_REDIRECT:http://localhost:5173/login?error=true}

short-url:
  max-retries: 3
  length: 6

kafka:
  topic:
    short-url-created: short-url-created
    short-url-created-dlt: short-url-created-dlt
    short-url-clicked: short-url-clicked
    short-url-clicked-dlt: short-url-clicked-dlt

short:
  url:
    base: ${SHORT_URL_BASE:http://localhost:8085/}